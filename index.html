<!DOCTYPE html>
<!--
  index.html — Pi System Monitor
  ════════════════════════════════════════════════════════════════════════════

  Responsibilities
  ────────────────
  This file contains ONLY structural markup.  No inline styles, no onclick/
  onchange attributes, no JavaScript logic.  All styling lives in styles.css
  and all behaviour lives in app.js.

  Static vs. dynamic content
  ───────────────────────────
  Static rows (CPU, RAM) are written directly in HTML because they always
  exist.  Disk rows are injected at runtime by app.js (syncDiskRows()) because
  the number and identity of disks is not known until the first API response.

  <template> elements
  ────────────────────
  The two <template> tags at the bottom of <body> define reusable markup
  fragments that are NEVER rendered by the browser.  app.js clones them via
  content.cloneNode(true) to build new disk rows and disk rename fields safely
  — no innerHTML string injection, no XSS risk.

    #tpl-disk-row    One .metric-row for the live dashboard metrics table.
    #tpl-disk-field  One .disk-field-wrap for the settings disk rename section.

  If you need to change the markup of a disk row or rename field, edit the
  corresponding <template> here — the JS will automatically use the new layout
  on the next clone.

  ID conventions
  ──────────────
  Static IDs (cpuBar, ramBar, etc.) are referenced directly by app.js.
  Dynamic disk element IDs are generated by diskRowId(mount) in app.js and
  follow the pattern  disk_<sanitised_mount_path>  and  disk_..._bar / _val.

  localStorage keys (managed by app.js)
  ───────────────────────────────────────
    pi_apiUrl      — API endpoint URL
    pi_diskNames   — JSON object { mountpoint: customLabel }
    pi_diskShowPct — 'true' | 'false'

  Pi-side API (tempd.py)
  ──────────────────────
  Expected response shape from GET /  →
  {
    temp:  number,              // CPU temperature in °C
    cpu:   number,              // CPU usage 0–100
    ram:  { used_mb, total_mb, percent },
    disks: [{ mount, label, used_gb, total_gb, percent }, ...]
  }
  ════════════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Monitor</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="widget">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <svg class="pi-icon" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14" stroke="#7dd8f0" stroke-width="1.5" opacity="0.4"/>
        <path d="M16 6C11 6 8 10 8 15C8 20 11 24 16 24C21 24 24 20 24 15C24 10 21 6 16 6Z"
              stroke="#7dd8f0" stroke-width="1.2" opacity="0.6" fill="none"/>
        <circle cx="16" cy="15" r="3" fill="#7dd8f0" opacity="0.7"/>
        <line x1="16" y1="24" x2="16" y2="27" stroke="#7dd8f0" stroke-width="1.5" opacity="0.3"/>
        <line x1="12" y1="26" x2="12" y2="28" stroke="#7dd8f0" stroke-width="1.5" opacity="0.3"/>
        <line x1="20" y1="26" x2="20" y2="28" stroke="#7dd8f0" stroke-width="1.5" opacity="0.3"/>
      </svg>
      <span class="device-name">raspberrypi</span>
    </div>
    <div class="header-right">
      <div class="status-dot fetching" id="statusDot"></div>
      <button class="gear-btn" id="gearBtn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42
                   M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="temp-wrap">
      <span class="temp-value dead" id="tempVal">--.-</span>
      <span class="temp-unit">°C</span>
    </div>
    <!-- Static CPU and RAM rows.
         Disk rows are injected here at runtime by syncDiskRows() in app.js.
         Bar fill widths start at the CSS default (--bar-fill: 0%) until the
         first API response arrives. -->
    <div class="metrics" id="metricsContainer">
      <div class="metric-row">
        <span class="metric-label">CPU</span>
        <div class="metric-bar-track">
          <div class="metric-bar-fill" id="cpuBar"></div>
        </div>
        <span class="metric-val" id="cpuVal">--%</span>
      </div>
      <div class="metric-row">
        <span class="metric-label">RAM</span>
        <div class="metric-bar-track">
          <div class="metric-bar-fill" id="ramBar"></div>
        </div>
        <span class="metric-val" id="ramVal" title="Click to toggle % / size">--</span>
      </div>
    </div>
  </div>

  <!-- FOOTER (normal state)
       #footerIp    — clickable host label; opens inline URL editor on click.
       #footerUrlEdit — hidden by default; .active class reveals the edit row.
       #lastUpdate  — timestamp of the last successful API poll (de-CH locale). -->
  <div class="footer" id="footerNormal">
    <span class="footer-text" id="footerIp" title="Click to change URL">raspberrypi:7777</span>
    <div class="footer-url-edit" id="footerUrlEdit">
      <input class="footer-url-input" id="footerUrlInput" type="text" spellcheck="false">
      <button class="footer-url-btn" id="footerUrlApplyBtn">↵</button>
      <button class="footer-url-cancel" id="footerUrlCancelBtn">✕</button>
    </div>
    <span class="footer-text" id="lastUpdate">--:--:--</span>
  </div>

  <!-- FOOTER (error state)
       Shown by showErrorFooter() when fetchMetrics() throws.
       #errMsg       — displays the error type ("Request timed out", "HTTP 404", etc.)
       #errUrlInput  — pre-filled with the current apiUrl so the user can fix it.
       Hidden by default (style="display:none"); shown/hidden exclusively by JS. -->
  <div class="footer footer-err" id="footerErr" style="display:none;">
    <div class="err-url-wrap">
      <span class="err-label" id="errMsg">ERR: Failed to fetch</span>
      <div class="err-input-row">
        <input class="err-input" id="errUrlInput" type="text"
               placeholder="http://raspberrypi:7777/" spellcheck="false">
        <button class="err-btn" id="errUrlApplyBtn">↵</button>
      </div>
    </div>
  </div>

  <!-- SETTINGS OVERLAY
       Full-screen panel; visibility controlled by .open class (see styles.css).
       All input values are populated by openSettings() in app.js when opened.
       #diskRenameFields is populated dynamically by syncDiskRenameFields(). -->
  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-header">
      <span class="settings-title">Settings</span>
      <button class="close-btn" id="settingsCloseBtn">✕</button>
    </div>

    <div class="settings-body">

      <!-- Endpoint section -->
      <div>
        <div class="settings-section-title">Endpoint</div>
        <div class="s-row">
          <div>
            <div class="s-field-label">API URL</div>
            <input class="s-input" id="s-apiUrl" type="text"
                   placeholder="http://raspberrypi:7777/">
          </div>
          <button class="s-btn" id="s-saveEndpointBtn">SAVE</button>
        </div>
      </div>

      <!-- Display mode section -->
      <div>
        <div class="settings-section-title">RAM &amp; Disk Display</div>
        <div class="s-toggle-row">
          <div>
            <div class="s-toggle-label">Show percentage</div>
            <div class="s-toggle-sub">
              Off = used/total &nbsp;·&nbsp; On = % used<br>
              Applies to RAM and all disks<br>
              Click any disk or RAM value to toggle instantly
            </div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="s-diskPct">
            <span class="toggle-track"></span>
          </label>
        </div>
      </div>

      <!-- Disk labels section — populated by app.js -->
      <div>
        <div class="settings-section-title">Disk Labels</div>
        <div id="diskRenameFields" style="display:flex; flex-direction:column;">
          <div style="font-size:2.5vw; color:var(--dim); opacity:0.5;">No disks detected yet.</div>
        </div>
      </div>

    </div>

    <div class="settings-footer">
      <button class="s-btn danger" id="s-resetBtn">RESET ALL</button>
      <button class="s-btn" id="s-saveAllBtn">SAVE &amp; CLOSE</button>
    </div>
  </div>

</div><!-- /.widget -->

<!-- ── TEMPLATES ──────────────────────────────────────────────────────────────
     <template> elements are inert — the browser never renders or executes their
     content.  app.js clones them via content.cloneNode(true) to create new DOM
     nodes safely, without innerHTML string injection.

     To change the markup of a disk row or rename field, edit the template here.
     The createDiskRow() and createDiskField() functions in app.js will
     automatically use the updated structure on the next clone.
     ──────────────────────────────────────────────────────────────────────── -->

<!-- Template: one live disk metric row in the dashboard.
     Cloned by createDiskRow(id) in app.js.
     app.js sets: row.id, bar.id, val.id, label.textContent, bar --bar-fill, val.textContent -->
<template id="tpl-disk-row">
  <div class="metric-row">
    <span class="metric-label"></span>
    <div class="metric-bar-track">
      <div class="metric-bar-fill"></div>
    </div>
    <span class="metric-val" title="Click to toggle % / size">--</span>
  </div>
</template>

<!-- Template: one disk rename field in the Settings overlay.
     Cloned by createDiskField(disk) in app.js.
     app.js sets: mount text, size text, input id/value/placeholder, SAVE listener -->
<template id="tpl-disk-field">
  <div class="disk-field-wrap">
    <div class="disk-field-header">
      <span class="disk-field-mount"></span>
      <span class="disk-field-size"></span>
    </div>
    <div class="disk-field-row">
      <input class="s-input" type="text" maxlength="8" style="flex:1;">
      <button class="s-btn">SAVE</button>
    </div>
  </div>
</template>

<script src="app.js"></script>
</body>
</html>
